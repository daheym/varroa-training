[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "varroa-training"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.5,<3", "torchvision>=0.20,<1", "ultralytics>=8.3,<9",
  "opencv-python>=4.10,<5", "Pillow>=11,<13", "pydantic>=2.10,<3",
  "numpy>=1.26,<3", "scipy>=1.14,<2", "PyYAML>=6,<7",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
export = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2", "onnxscript>=0.3,<1"]

[project.scripts]
varroa = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
