<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Varroa mite overview</title>
<style>
body{font:14px system-ui;background:#11151b;color:#e5eaf0;margin:24px}p{max-width:1000px;color:#b8c6d5}select,button{font:inherit;padding:8px;background:#263545;color:inherit;border:1px solid #718194;border-radius:5px;margin:6px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}figure{margin:0;border:2px solid #82909d;padding:3px;cursor:zoom-in}.missed{border-color:#ff667b}.matched{border-color:#40d6a1}.mixed{border-color:#e7baff}.extra{border-color:#ffbc54}img{width:100%;image-rendering:auto}figcaption{font-size:11px}dialog{background:#18232e;color:inherit;border:1px solid #82909d;max-width:600px}dialog img{width:384px;max-width:80vw}dialog::backdrop{background:#000b}@media print{#controls,dialog{display:none}body{background:white;color:black}figure{break-inside:avoid}}
</style>
<h1>Mite overview <small id="run"></small></h1><p id="note"></p>
<p>Green: matched · Red: missed · Purple: mixed tile outcomes · Orange: unmatched prediction · Gray: not evaluated. Click a crop to enlarge. Use the labeling app’s Mite overview to save quality flags.</p>
<div id="controls"><label>Result <select id="result"><option value="">All results</option><option>missed</option><option>extra</option><option>mixed</option><option>matched</option><option>not_evaluated</option></select></label><label>Membership <select id="split"><option value="">All splits</option><option value="train">Training</option><option value="val">Validation</option></select></label><button id="prev">Previous</button><span id="count"></span><button id="next">Next</button><button onclick="window.print()">Print / PDF</button></div>
<div id="grid"></div><dialog id="detail"><button id="close">Close</button><div id="body"></div></dialog>
<script>
const data=__INSPECTION_DATA__;let page=0;const $=id=>document.getElementById(id);
$('run').textContent=data.run_name;$('note').textContent=data.interpretation+' '+data.note;
function render(){const rows=data.items.filter(i=>(!$('result').value||i.status===$('result').value)&&(!$('split').value||i.splits.includes($('split').value)));page=Math.min(page,Math.max(0,Math.ceil(rows.length/500)-1));$('grid').replaceChildren();$('count').textContent=`${rows.length} crops · page ${page+1} / ${Math.max(1,Math.ceil(rows.length/500))}`;$('prev').disabled=page===0;$('next').disabled=(page+1)*500>=rows.length;for(const i of rows.slice(page*500,(page+1)*500)){const f=document.createElement('figure');f.className=i.status;f.tabIndex=0;const img=document.createElement('img');img.src=i.crop;img.loading='lazy';img.alt=`${i.status} at ${i.x.toFixed(1)}, ${i.y.toFixed(1)}`;const c=document.createElement('figcaption');c.textContent=i.status+' · '+(i.splits.join('+')||'unused');f.append(img,c);const open=()=>{$('body').replaceChildren(img.cloneNode(),document.createElement('pre'));$('body').lastChild.textContent=JSON.stringify(i,null,2);$('detail').showModal()};f.onclick=open;f.onkeydown=e=>{if(e.key==='Enter')open()};$('grid').append(f)}}
$('result').onchange=$('split').onchange=()=>{page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('close').onclick=()=>$('detail').close();render();
</script></html>
